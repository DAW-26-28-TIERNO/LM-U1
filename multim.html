<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>
        <h1>Multimedia</h1>
    </header>
    <main>
        <article>
            <h2>Imágenes</h2>
            <h3>Imagen con img</h3>
            <img src="media/image600x400.png" alt="Imagen negra que dice el tamaño" width="300">

            <h3>Imagen con figure</h3>
            <p>Imagen con figcaption</p>
            <figure>
                <img src="media/image600x400.png" alt="Imagen negra que dice el tamaño" width="300">
                <figcaption>Imagen 600x400</figcaption>
            </figure>

            <h3>Imagen con picture</h3>
            <p>Imagen con reglas de tamaño</p>
            <figure>
                <picture>
                    <source srcset="./media/image600x400.png" media="(min-width: 800px)">
                    <source srcset="./media/image300x200.png" media="(min-width: 600px)">
                    <img src="media/image150x100.png" alt="Imagen">
                </picture>
                <figcaption>Imagen que cambia</figcaption>
            </figure>
        </article>

        <article>
            <h2>Vídeo y audio</h2>
            <video src="media/video.mov" controls ></video>
            <video src="media/video.mov" autoplay></video>
            <video src="media/video.ogg" autoplay loop muted></video>


            <p>Vídeo con varias sources</p>
            <video controls autoplay muted loop>
                <source src="media/video.ogg">
                <source src="media/video.mp4">
                <source src="media/video.avi">
            </video>
        </article>

        <article>
            <h2>Youtube:</h2>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/b2D1_CVxXcM?si=prz6fRQKVnNBhMlo" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

            <h2>Insertar un pdf</h2>
            <iframe src="media/LM.pdf" frameborder="0" width="100%" height="500px">
            </iframe>
        </article>
    </main>
    <footer>

    </footer>
</body>

</html>
